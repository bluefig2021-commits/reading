name: collect
on:
  schedule:
    - cron: "0 */6 * * *"   # 6시간마다
  workflow_dispatch:         # 수동 실행 버튼
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: collect
        run: python scripts/collect.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: commit
        run: |
          git config user.name "collector-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/items.json
          git diff --cached --quiet || (git commit -m "collect: new items" && git push)
